name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 배포 전에 데이터 갱신
        required: false
        default: true
        type: boolean
  schedule:
    # 평일 20:20 KST (11:20 UTC) — 장마감 후 종가 확정 시각에 일 1회 갱신.
    # 분을 정시(:00~:10)에서 띄움: GitHub 스케줄은 정시 근처 부하로 지연·드롭이 잦음(공식 권고).
    - cron: "20 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 증분 캐시(가격·DART corpCode·KRX 업종분류)는 git에 커밋하지 않고 actions/cache로 영속한다.
      # key가 run마다 달라 항상 miss → restore-keys로 직전 캐시 복원 → job 종료 시 새 key로 저장.
      - name: Restore price cache
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/cache@v4
        with:
          path: |
            data/price_cache.json
            data/dart_corp_codes.json
            data/sector_cache.json
          key: price-cache-${{ github.run_id }}
          restore-keys: |
            price-cache-

      - name: Refresh NPS data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        env:
          # secret 또는 variable 어디에 등록했든 동작(미등록 시 빈 값 → 해당 소스만 생략)
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || vars.KOSIS_API_KEY }}
          # DART 대량보유 공시(5%↑ 수량을 공시 당일 반영). 없으면 FnGuide/연말 수량 유지.
          DART_API_KEY: ${{ secrets.DART_API_KEY || vars.DART_API_KEY }}
          # KRX 데이터포털 계정(선택) — 있으면 섹터를 KRX 표준 업종분류로, 없으면 KIND 산업분류로.
          KRX_ID: ${{ secrets.KRX_ID || vars.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW || vars.KRX_PW }}
        run: python fetch_data.py

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          # add를 먼저 해야 신규 파일(연말 아카이브 등 untracked)도 변경으로 감지된다.
          git add data.js data.json current.json data/nav_history.json \
            data/seed_fund_portfolio.json data/seed_holdings_latest.json data/archive
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NPS data ($(TZ='Asia/Seoul' date +%Y-%m-%d))"
          git push origin HEAD:main

      # F-4 급변동 알림: 발행된 NAV 일간 변동이 ±3% 이상이면 라벨 nav-alert 이슈로 알린다
      # (저장소 watch 중이면 GitHub가 메일 발송 — 별도 토큰 불필요. Telegram 등은 추후 확장).
      # 같은 asOf 날짜로는 한 번만 알리고, 열린 nav-alert 이슈가 있으면 코멘트만 단다.
      - name: NAV move alert
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/github-script@v7
        with:
          script: |
            const THRESHOLD_PCT = 3.0;
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('data.json', 'utf8')); } catch { return; }
            const pct = data?.summary?.todayPct;
            const asOf = data?.summary?.asOf;
            if (pct == null || !asOf || Math.abs(pct) < THRESHOLD_PCT) return;
            const label = 'nav-alert';
            const sign = pct > 0 ? '+' : '';
            const title = `NAV 급변동 ${sign}${pct.toFixed(2)}% (${asOf})`;
            const { data: recent } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: label, per_page: 20,
            });
            if (recent.some(i => i.title.includes(`(${asOf})`))) return;  // 같은 날짜 중복 방지
            const nav = data?.summary?.nav;
            const top = (data?.sectors || []).slice(0, 3)
              .map(s => `${s.name} ${s.changePct == null ? '-' : (s.changePct > 0 ? '+' : '') + s.changePct.toFixed(2)}%`)
              .join(' · ');
            const body = `국민연금 국내주식 포트폴리오 NAV가 하루 ${sign}${pct.toFixed(2)}% 움직였습니다 (${asOf}, NAV ${nav}).\n\n` +
              (top ? `섹터 상위: ${top}\n\n` : '') +
              `대시보드: https://ducklove.github.io/nps-tracker/\n` +
              `데이터 경고: ${(data?.warnings || []).length}건`;
            const open = recent.filter(i => i.state === 'open');
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body: `**${title}**\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # 데이터 갱신 경로 실패 시 라벨 batch-failure 이슈 생성(이미 열린 동일 라벨 이슈가 있으면 코멘트만).
      - name: Report batch failure
        if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'batch-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const kstDate = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
            const body = `데이터 갱신 배치가 실패했습니다 (${kstDate}, event: \`${context.eventName}\`).\n\n` +
              `실행 로그: ${runUrl}\n\n` +
              '검증 게이트가 발행을 중단했거나(exit 2) 수집 단계에서 예외가 발생했을 수 있습니다. ' +
              '로그의 `검증 실패:` / `ERROR` 항목을 확인하세요.';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `데이터 갱신 배치 실패 (${kstDate})`, body, labels: [label],
              });
            }
