name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 배포 전에 데이터 갱신
        required: false
        default: true
        type: boolean
  schedule:
    # 평일 20:20 KST (11:20 UTC) — 장마감 후 종가 확정 시각에 일 1회 갱신.
    # 분을 정시(:00~:10)에서 띄움: GitHub 스케줄은 정시 근처 부하로 지연·드롭이 잦음(공식 권고).
    - cron: "20 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 가격 증분 캐시(data/price_cache.json)는 git에 커밋하지 않고 actions/cache로 영속한다.
      # key가 run마다 달라 항상 miss → restore-keys로 직전 캐시 복원 → job 종료 시 새 key로 저장.
      - name: Restore price cache
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/cache@v4
        with:
          path: data/price_cache.json
          key: price-cache-${{ github.run_id }}
          restore-keys: |
            price-cache-

      - name: Refresh NPS data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        env:
          # secret 또는 variable 어디에 등록했든 동작(미등록 시 빈 값 → KOSIS 생략하고 seed 사용)
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || vars.KOSIS_API_KEY }}
        run: python fetch_data.py

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          if git diff --quiet -- data.js data.json current.json data/nav_history.json data/seed_fund_portfolio.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.json current.json data/nav_history.json data/seed_fund_portfolio.json
          git commit -m "Update NPS data ($(TZ='Asia/Seoul' date +%Y-%m-%d))"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # 데이터 갱신 경로 실패 시 라벨 batch-failure 이슈 생성(이미 열린 동일 라벨 이슈가 있으면 코멘트만).
      - name: Report batch failure
        if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'batch-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const kstDate = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
            const body = `데이터 갱신 배치가 실패했습니다 (${kstDate}, event: \`${context.eventName}\`).\n\n` +
              `실행 로그: ${runUrl}\n\n` +
              '검증 게이트가 발행을 중단했거나(exit 2) 수집 단계에서 예외가 발생했을 수 있습니다. ' +
              '로그의 `검증 실패:` / `ERROR` 항목을 확인하세요.';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `데이터 갱신 배치 실패 (${kstDate})`, body, labels: [label],
              });
            }
