name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 배포 전에 데이터 갱신
        required: false
        default: true
        type: boolean
  schedule:
    # 평일 16:20 KST (07:20 UTC) — 장마감(15:30) 직후 본 실행. 실측상 스케줄은 1~3시간
    # 지연되므로 실제 시작은 대략 17~19시 KST. 분을 정시(:00~:10)에서 띄움(공식 권고).
    - cron: "20 7 * * 1-5"
    # 평일 21:35 KST (12:35 UTC) — 보조 실행. 본 실행이 드롭/실패해도 당일 안에 만회한다.
    # 데이터 변화가 없으면 커밋을 생략하므로 중복 실행 비용은 배포뿐이다.
    - cron: "35 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_data.outputs.page_url }}
    runs-on: ubuntu-latest
    # 걸린 실행이 concurrency 그룹(pages)을 붙잡아 다음 스케줄까지 막는 사고 방지.
    # 정상 실행은 ~5분(KIS 병렬 시세 + DART 병렬 + 차단 호스트 회로차단기 적용 후).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 증분 캐시(가격·DART corpCode·KRX 업종분류)는 git에 커밋하지 않고 actions/cache로 영속한다.
      # key가 run마다 달라 항상 miss → restore-keys로 직전 캐시 복원 → job 종료 시 새 key로 저장.
      - name: Restore price cache
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/cache@v4
        with:
          path: |
            data/price_cache.json
            data/dart_corp_codes.json
            data/sector_cache.json
          key: price-cache-${{ github.run_id }}
          restore-keys: |
            price-cache-

      - name: Refresh NPS data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        timeout-minutes: 18
        env:
          # secret 또는 variable 어디에 등록했든 동작(미등록 시 빈 값 → 해당 소스만 생략)
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || vars.KOSIS_API_KEY }}
          # DART 대량보유 공시(5%↑ 수량을 공시 당일 반영). 없으면 FnGuide/연말 수량 유지.
          DART_API_KEY: ${{ secrets.DART_API_KEY || vars.DART_API_KEY }}
          # KRX 데이터포털 계정(선택) — 있으면 섹터를 KRX 표준 업종분류로, 없으면 KIND 산업분류로.
          KRX_ID: ${{ secrets.KRX_ID || vars.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW || vars.KRX_PW }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL || vars.KIS_BASE_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || vars.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || vars.KIS_APP_SECRET }}
          KIS_ACCESS_TOKEN: ${{ secrets.KIS_ACCESS_TOKEN || vars.KIS_ACCESS_TOKEN }}
        run: python fetch_data.py

      - name: Commit refreshed data
        id: commit_data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          # add를 먼저 해야 신규 파일(연말 아카이브 등 untracked)도 변경으로 감지된다.
          git add data.js data.json current.json data/nav_history.json \
            data/seed_fund_portfolio.json data/seed_holdings_latest.json data/archive
          git add --ignore-errors data/seed_foreign_holdings.json || true  # 해외주식 seed(없을 수 있음)
          git add --ignore-errors assets/og-image.png || true              # OG 공유 카드(일배치 갱신)
          git add --ignore-errors data/holdings_latest.csv feed.xml || true  # 재사용 산출물(F-14)
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NPS data ($(TZ='Asia/Seoul' date +%Y-%m-%d))"
          git push origin HEAD:main
          # 새 데이터 커밋 SHA — Deploy의 pages_build_version으로 사용(아래 주석 참조)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # F-4 급변동 알림: 발행된 NAV 일간 변동이 ±3% 이상이면 라벨 nav-alert 이슈로 알린다
      # (저장소 watch 중이면 GitHub가 메일 발송 — 별도 토큰 불필요. Telegram 등은 추후 확장).
      # 같은 asOf 날짜로는 한 번만 알리고, 열린 nav-alert 이슈가 있으면 코멘트만 단다.
      - name: NAV move alert
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/github-script@v7
        with:
          script: |
            const THRESHOLD_PCT = 3.0;
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('data.json', 'utf8')); } catch { return; }
            const pct = data?.summary?.todayPct;
            const asOf = data?.summary?.asOf;
            if (pct == null || !asOf || Math.abs(pct) < THRESHOLD_PCT) return;
            const label = 'nav-alert';
            const sign = pct > 0 ? '+' : '';
            const title = `NAV 급변동 ${sign}${pct.toFixed(2)}% (${asOf})`;
            const { data: recent } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: label, per_page: 20,
            });
            if (recent.some(i => i.title.includes(`(${asOf})`))) return;  // 같은 날짜 중복 방지
            const nav = data?.summary?.nav;
            const top = (data?.sectors || []).slice(0, 3)
              .map(s => `${s.name} ${s.changePct == null ? '-' : (s.changePct > 0 ? '+' : '') + s.changePct.toFixed(2)}%`)
              .join(' · ');
            const body = `국민연금 국내주식 포트폴리오 NAV가 하루 ${sign}${pct.toFixed(2)}% 움직였습니다 (${asOf}, NAV ${nav}).\n\n` +
              (top ? `섹터 상위: ${top}\n\n` : '') +
              `대시보드: https://ducklove.github.io/nps-tracker/\n` +
              `데이터 경고: ${(data?.warnings || []).length}건`;
            const open = recent.filter(i => i.state === 'open');
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body: `**${title}**\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Pages는 pages_build_version(deploy-pages가 GITHUB_SHA에서 읽음)이 이미 배포된
      # 버전과 같으면 새 artifact를 서빙에 반영하지 않는다. refresh 실행의 GITHUB_SHA는
      # 트리거 시점 커밋이라, 코드 push가 같은 SHA를 먼저 배포해 두면 직후의 데이터 갱신
      # 배포가 조용히 무시된다(2026-07-03 실증). GITHUB_SHA는 예약 변수라 env로 오버라이드도
      # 불가(실측) → 데이터 커밋을 만든 실행은 Pages 배포 API를 직접 호출해 버전을 새 데이터
      # 커밋 SHA로 지정한다. 코드 push 배포(SHA가 항상 유니크)는 공식 액션을 그대로 쓴다.
      - name: Deploy
        id: deployment
        if: steps.commit_data.outputs.sha == ''
        uses: actions/deploy-pages@v4

      - name: Deploy (data commit version)
        id: deployment_data
        if: steps.commit_data.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          PAGES_BUILD_VERSION: ${{ steps.commit_data.outputs.sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const version = process.env.PAGES_BUILD_VERSION;
            const oidcToken = await core.getIDToken();
            const { data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: version,
              oidc_token: oidcToken,
            });
            core.info(`Pages 배포 생성: version=${version} id=${dep.id}`);
            core.setOutput('page_url', dep.page_url);
            const bad = ['deployment_failed', 'deployment_content_failed',
                         'deployment_attempt_error', 'deployment_cancelled', 'deployment_lost'];
            for (let i = 0; i < 36; i++) {  // 최대 ~3분 폴링
              const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner: context.repo.owner, repo: context.repo.repo, deployment_id: dep.id,
              });
              core.info(`배포 상태: ${st.status}`);
              if (st.status === 'succeed') return;
              if (bad.includes(st.status)) throw new Error(`Pages 배포 실패: ${st.status}`);
              await new Promise(r => setTimeout(r, 5000));
            }
            throw new Error('Pages 배포 상태 확인 타임아웃');

      # 데이터 갱신 경로 실패 시 라벨 batch-failure 이슈 생성(이미 열린 동일 라벨 이슈가 있으면 코멘트만).
      - name: Report batch failure
        if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'batch-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const kstDate = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
            const body = `데이터 갱신 배치가 실패했습니다 (${kstDate}, event: \`${context.eventName}\`).\n\n` +
              `실행 로그: ${runUrl}\n\n` +
              '검증 게이트가 발행을 중단했거나(exit 2) 수집 단계에서 예외가 발생했을 수 있습니다. ' +
              '로그의 `검증 실패:` / `ERROR` 항목을 확인하세요.';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `데이터 갱신 배치 실패 (${kstDate})`, body, labels: [label],
              });
            }
